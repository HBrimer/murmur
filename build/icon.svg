<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Murmur app icon: the app's blue-violet gradient with a waveform mark.
       Rendered to build/icon.png and build/icon.ico by scripts/make-icon.js. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#8b7bf0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#shine)"/>
  <g stroke="#fff" stroke-width="84" stroke-linecap="round" fill="none">
    <path d="M272 452v120"/>
    <path d="M392 352v320"/>
    <path d="M512 272v480"/>
    <path d="M632 372v280"/>
    <path d="M752 462v100"/>
  </g>
</svg>
